name: Build Multiplatform
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: write
  actions: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          { echo '## Dart Analyzer Output'; echo '```text'; cat analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run Flutter tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          { echo '## Flutter Test Output'; echo '```text'; cat test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-test
          path: '*.log'
          if-no-files-found: warn

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android .
      - name: Apply checked-in Android native playback handlers
        run: python3 tool/apply_native_hosts.py android
      - name: Configure Android TV and Fire TV manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application', 1)
          s = s.replace('<category android:name="android.intent.category.LAUNCHER" />', '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />', 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          { echo '## Dart Analyzer Output'; echo '```text'; cat analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Build Android arm64 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi 2>&1 | tee build.log
      - name: Build Android armeabi-v7a APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm --split-per-abi 2>&1 | tee -a build.log
      - uses: actions/upload-artifact@v4
        with:
          name: android-firetv-apks
          path: build/app/outputs/flutter-apk/*.apk
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-android
          path: '*.log'
          if-no-files-found: warn

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stable lane blocks merges; the preview lane is early-warning only.
          - name: stable
            runner: macos-26
            xcode_major: 26
            ios_sdk_major: 26
            macos_sdk_major: 26
            experimental: false
          - name: latest
            runner: xcode-27
            xcode_major: 27
            ios_sdk_major: 27
            macos_sdk_major: 27
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    # Deployment target stays 15.0; selected Xcode/SDK is the compatibility target.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.5'}
      - name: Verify Apple SDK policy
        run: python3 tool/apple_mesh/verify_apple_toolchain.py --xcode-major ${{ matrix.xcode_major }} --ios-sdk-major ${{ matrix.ios_sdk_major }} --macos-sdk-major ${{ matrix.macos_sdk_major }} --go-version 1.25.5
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Build pinned macOS TailscaleKit framework
        run: python3 tool/apple_mesh/build_tailscalekit.py macos --xcode-major ${{ matrix.xcode_major }}
      - name: Generate macOS project
        run: flutter create --platforms=macos .
      - name: Apply checked-in macOS native playback handlers
        run: python3 tool/apply_native_hosts.py macos
      - name: Verify generated macOS network entitlements
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          for name in ('DebugProfile.entitlements', 'Release.entitlements'):
              path = Path('macos/Runner') / name
              with path.open('rb') as handle:
                  entitlements = plistlib.load(handle)
              for key in ('com.apple.security.network.client', 'com.apple.security.network.server'):
                  if entitlements.get(key) is not True:
                      raise SystemExit(f'{path}: {key} must be true')
          PY
      - name: Prepare minimal D3 macOS native host
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('tool/native_hosts/macos/MainFlutterWindow.swift').read_text()
          start_marker = 'private final class PrivateNetworkHost'
          end_marker = 'private final class AppleCompatibilityPlaybackManager'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('Private-network source markers must occur exactly once')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          if end <= start:
              raise SystemExit('Invalid private-network source marker order')
          private_network = source[start:end]
          host = '''import Cocoa
          import Foundation
          import FlutterMacOS
          import TailscaleKit

          class MainFlutterWindow: NSWindow {
            private let privateNetwork = PrivateNetworkHost()
            private let tailscaleKitLinkProof: TailscaleNode.Type = TailscaleNode.self

            override func awakeFromNib() {
              _ = tailscaleKitLinkProof
              let flutterViewController = FlutterViewController()
              let windowFrame = self.frame
              self.contentViewController = flutterViewController
              self.setFrame(windowFrame, display: true)

              let messenger = flutterViewController.engine.binaryMessenger

              FlutterMethodChannel(
                name: "rodplayer/private_network",
                binaryMessenger: messenger
              ).setMethodCallHandler(privateNetwork.handle)

              FlutterEventChannel(
                name: "rodplayer/private_network_events",
                binaryMessenger: messenger
              ).setStreamHandler(privateNetwork)

              RegisterGeneratedPlugins(registry: flutterViewController)
              super.awakeFromNib()
            }
          }

          '''
          Path('macos/Runner/MainFlutterWindow.swift').write_text(host + private_network)

          podfile = Path('macos/Podfile')
          lines = podfile.read_text().splitlines(keepends=True)
          vlckit = "pod 'VLCKit', '~> 3.3.0'"
          matches = [line for line in lines if vlckit in line]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one generated VLCKit pod line')
          podfile.write_text(''.join(line for line in lines if vlckit not in line))
          PY
      - name: Configure temporary D3 arm64 release build
        run: |
          config=macos/Runner/Configs/Release.xcconfig
          test -f "$config"
          printf '\nEXCLUDED_ARCHS = x86_64\n' >> "$config"
      - run: flutter pub get && cd macos && pod install --repo-update
      - name: Analyze Dart code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          { echo '## Dart Analyzer Output'; echo '```text'; cat analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Prepare minimal D3 live-proof dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          excluded = {
              'media_kit',
              'media_kit_video',
              'media_kit_libs_ios_video',
              'media_kit_libs_macos_video',
              'media_kit_libs_windows_video',
              'media_kit_libs_linux',
          }
          output = []
          in_dependencies = False
          for line in path.read_text().splitlines(keepends=True):
              if line == 'dependencies:\n':
                  in_dependencies = True
              elif line and not line.startswith((' ', '\t')):
                  in_dependencies = False
              if in_dependencies and line.startswith('  ') and not line.startswith('    '):
                  key = line.split(':', 1)[0].strip()
                  if key in excluded:
                      continue
              output.append(line)
          path.write_text(''.join(output))
          PY
          rm -rf macos/Pods
          rm -f macos/Podfile.lock
          rm -rf build/macos
          flutter pub get
          cd macos
          pod install --repo-update
      - name: Verify minimal D3 macOS build inputs
        run: |
          host=macos/Runner/MainFlutterWindow.swift
          podfile=macos/Podfile
          for forbidden in 'import VLCKit' AppleCompatibilityPlayback ApplePlaybackManager; do
            if grep -Fq "$forbidden" "$host"; then
              echo "Unexpected playback input: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Fq "pod 'VLCKit'" "$podfile" || test -d macos/Pods/VLCKit; then
            echo 'VLCKit remains in the temporary D3 build' >&2
            exit 1
          fi
          for required in 'private final class PrivateNetworkHost' ApplePrivateNetworkNodeOwner TailscaleKitNodeFactory RodPlayerTailscaleLogSink 'import TailscaleKit'; do
            grep -Fq "$required" "$host" || { echo "Missing required private-network input: $required" >&2; exit 1; }
          done
          grep -Fq "pod 'RodPlayerTailscaleKit'" "$podfile" || { echo 'Missing RodPlayerTailscaleKit pod' >&2; exit 1; }
      - name: Build macOS app
        run: |
          framework=build/apple_mesh/macos/TailscaleKit.framework/TailscaleKit
          test -f "$framework"
          file "$framework"
          lipo -info "$framework"
          set -o pipefail
          flutter build macos --release -t lib/d3_live_proof.dart 2>&1 | tee build.log
      - name: Validate D3 macOS app bundle
        run: |
          app=build/macos/Build/Products/Release/rodplayer.app
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -n "$executable"
          binary="$app/Contents/MacOS/$executable"
          test -f "$binary"
          test -x "$binary"
          file "$binary"
          architectures=$(lipo -info "$binary")
          printf '%s\n' "$architectures"
          case "$architectures" in *arm64*) ;; *) echo 'RodPlayer executable is missing arm64' >&2; exit 1 ;; esac
          /usr/bin/codesign -d --entitlements :- "$app" > signed-entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path('signed-entitlements.plist').open('rb') as handle:
              entitlements = plistlib.load(handle)
          for key in ('com.apple.security.network.client', 'com.apple.security.network.server'):
              if entitlements.get(key) is not True:
                  raise SystemExit(f'signed app: {key} must be true')
          PY
      - run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/rodplayer.app RodPlayer-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rodplayer-d3-live-macos-${{ matrix.name }}
          path: RodPlayer-macOS.zip
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-macos-${{ matrix.name }}
          path: '*.log'
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate Windows project
        run: flutter create --platforms=windows .
      - name: Apply checked-in Windows native playback handlers
        run: python tool/apply_native_hosts.py windows
      - run: flutter pub get
      - name: Analyze Dart code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          { echo '## Dart Analyzer Output'; echo '```text'; cat analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Build Windows x64
        shell: bash
        run: flutter build windows --release 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with: {name: rodplayer-windows-x64, path: build/windows/x64/runner/Release}
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with: {name: debug-logs-windows, path: '*.log', if-no-files-found: warn}

  ios:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stable lane blocks merges; the preview lane is early-warning only.
          - name: stable
            runner: macos-26
            xcode_major: 26
            ios_sdk_major: 26
            macos_sdk_major: 26
            experimental: false
          - name: latest
            runner: xcode-27
            xcode_major: 27
            ios_sdk_major: 27
            macos_sdk_major: 27
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    # Deployment target stays 18.1; selected Xcode/SDK is the compatibility target.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.5'}
      - name: Verify Apple SDK policy
        run: python3 tool/apple_mesh/verify_apple_toolchain.py --xcode-major ${{ matrix.xcode_major }} --ios-sdk-major ${{ matrix.ios_sdk_major }} --macos-sdk-major ${{ matrix.macos_sdk_major }} --go-version 1.25.5
      - uses: subosito/flutter-action@v2
        with: {channel: stable, architecture: arm64, cache: true}
      - name: Build pinned iOS TailscaleKit framework
        run: python3 tool/apple_mesh/build_tailscalekit.py ios --xcode-major ${{ matrix.xcode_major }}
      - name: Generate iOS project
        run: flutter create --platforms=ios .
      - name: Apply checked-in iOS native playback handlers
        run: python3 tool/apply_native_hosts.py ios
      - name: Configure unsigned build
        run: |
          mkdir -p ios/Flutter
          for c in Debug Release; do printf '%s\n' 'CODE_SIGNING_ALLOWED = NO' 'CODE_SIGNING_REQUIRED = NO' 'CODE_SIGN_IDENTITY =' >> "ios/Flutter/$c.xcconfig"; done
      - name: Install dependencies and CocoaPods
        run: flutter pub get && cd ios && pod install --repo-update
      - name: Analyze Dart code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          { echo '## Dart Analyzer Output'; echo '```text'; cat analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign 2>&1 | tee build.log
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-ios-${{ matrix.name }}
          path: '*.log'
          if-no-files-found: warn
