name: Build Multiplatform
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android .
      - name: Add Android TV and Fire TV launcher support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          text = text.replace('<application', '<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application', 1)
          text = text.replace('<category android:name="android.intent.category.LAUNCHER" />', '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />', 1)
          path.write_text(text)
          PY
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Build Android arm64 APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi 2>&1 | tee build.log
      - name: Build Android armeabi-v7a APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm --split-per-abi 2>&1 | tee -a build.log
      - name: Upload Android and Fire TV APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-firetv-apks
          path: build/app/outputs/flutter-apk/*.apk
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-android
          path: '*.log'
          if-no-files-found: warn
      - name: File issue on failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## GitHub Actions failure"
            echo "Job: $GITHUB_JOB"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Commit: $GITHUB_SHA"
            if [ -f build.log ]; then
              echo -e "\n### Build Log Tail (last 150 lines):\n\`\`\`text"
              tail -n 150 build.log
              echo -e "\`\`\`"
            fi
            if [ -f analyze.log ]; then
              echo -e "\n### Analyze Log:\n\`\`\`text"
              tail -n 100 analyze.log
              echo -e "\`\`\`"
            fi
          } > failure-report.md
          gh issue create --title "CI failure: $GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER ($GITHUB_JOB)" --body-file failure-report.md || true
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS project
        run: flutter create --platforms=macos .
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Build macOS app
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build.log
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/rodplayer.app RodPlayer-macOS.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodplayer-macos
          path: RodPlayer-macOS.zip
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-macos
          path: '*.log'
          if-no-files-found: warn
      - name: File issue on failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## GitHub Actions failure"
            echo "Job: $GITHUB_JOB"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Commit: $GITHUB_SHA"
            if [ -f build.log ]; then
              echo -e "\n### Build Log Tail (last 150 lines):\n\`\`\`text"
              tail -n 150 build.log
              echo -e "\`\`\`"
            fi
            if [ -f analyze.log ]; then
              echo -e "\n### Analyze Log:\n\`\`\`text"
              tail -n 100 analyze.log
              echo -e "\`\`\`"
            fi
          } > failure-report.md
          gh issue create --title "CI failure: $GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER ($GITHUB_JOB)" --body-file failure-report.md || true
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows .
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Build Windows x64
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodplayer-windows-x64
          path: build/windows/x64/runner/Release
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-windows
          path: '*.log'
          if-no-files-found: warn
      - name: File issue on failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## GitHub Actions failure"
            echo "Job: $GITHUB_JOB"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Commit: $GITHUB_SHA"
            if [ -f build.log ]; then
              echo -e "\n### Build Log Tail (last 150 lines):\n\`\`\`text"
              tail -n 150 build.log
              echo -e "\`\`\`"
            fi
            if [ -f analyze.log ]; then
              echo -e "\n### Analyze Log:\n\`\`\`text"
              tail -n 100 analyze.log
              echo -e "\`\`\`"
            fi
          } > failure-report.md
          gh issue create --title "CI failure: $GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER ($GITHUB_JOB)" --body-file failure-report.md || true