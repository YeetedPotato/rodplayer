name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64
          cache: true
      - name: Generate native iOS project when absent
        run: test -d ios && test -f ios/Podfile || flutter create --platforms=ios .
      - name: Set iOS 13 deployment target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('ios/Podfile')
          text = path.read_text()
          text = re.sub(r"platform :ios, ['\"][^'\"]+['\"]", "platform :ios, '13.0'", text)
          if 'platform :ios' not in text:
              text = "platform :ios, '13.0'" + chr(10) + text
          if 'IPHONEOS_DEPLOYMENT_TARGET' not in text:
              anchor = 'flutter_additional_ios_build_settings(target)'
              nested = (anchor + chr(10) +
                        '      target.build_configurations.each do |config|' + chr(10) +
                        "        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'" + chr(10) +
                        '      end')
              if anchor in text:
                  text = text.replace(anchor, nested, 1)
              else:
                  raise RuntimeError('Expected Flutter post_install target hook was not found')
          path.write_text(text)
          PY
      - name: Install dependencies and pods
        run: flutter pub get && cd ios && pod install --repo-update
      - name: Build unsigned iOS bundle
        run: flutter build ios --release --no-codesign
        env:
          FLUTTER_BUILD_NAME: 0.1.0
          FLUTTER_BUILD_NUMBER: 1
      - name: Package sideloadable IPA
        run: |
          set -eux
          rm -rf Payload RodPlayer.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload RodPlayer.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RodPlayer-ipa
          path: RodPlayer.ipa
          if-no-files-found: error
      - name: File issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## GitHub Actions failure"
            echo "Job: $GITHUB_JOB"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Commit: $GITHUB_SHA"
            echo
            echo '### Failed-log tail'
            gh run view "$GITHUB_RUN_ID" --log-failed 2>&1 | tail -n 120
          } > failure-report.md
          gh issue create --title "CI failure: $GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER ($GITHUB_JOB)" --body-file failure-report.md